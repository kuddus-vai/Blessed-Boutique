<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Soft blush watercolor gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2EE" />
      <stop offset="50%" stop-color="#F8E5DF" />
      <stop offset="100%" stop-color="#F6DDD6" />
    </linearGradient>
    <linearGradient id="awningStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E28B96" />
      <stop offset="50%" stop-color="#EAA6AF" />
      <stop offset="100%" stop-color="#E28B96" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Soft watercolor clouds/texture -->
  <ellipse cx="600" cy="120" rx="450" ry="160" fill="#FFF8F5" opacity="0.6" filter="blur(30px)" />
  <ellipse cx="200" cy="350" rx="300" ry="120" fill="#F4D3C9" opacity="0.4" filter="blur(40px)" />

  <!-- Left: Cute Boutique Storefront & Fashion Lady -->
  <g transform="translate(60, 50)">
    <!-- Hanging potted plants from ceiling -->
    <path d="M 40 0 L 40 50" stroke="#7A8B7B" stroke-width="2" />
    <circle cx="40" cy="55" r="14" fill="#98A899" />
    <path d="M 30 55 C 20 70 30 90 40 85 C 50 90 60 70 50 55 Z" fill="#607662" />

    <path d="M 280 0 L 280 40" stroke="#7A8B7B" stroke-width="2" />
    <circle cx="280" cy="45" r="12" fill="#98A899" />
    <path d="M 270 45 C 265 60 275 75 280 70 C 285 75 295 60 290 45 Z" fill="#607662" />

    <!-- Storefront awning roof -->
    <path d="M 20 100 L 260 100 L 275 160 L 5 160 Z" fill="#E89BA5" />
    <!-- White scallops / stripes -->
    <path d="M 40 100 L 55 160 M 80 100 L 95 160 M 120 100 L 135 160 M 160 100 L 175 160 M 200 100 L 215 160 M 240 100 L 255 160" stroke="#FFF" stroke-width="12" stroke-linecap="round" />
    <!-- Awning sign "Blessed Boutique" -->
    <rect x="40" y="145" width="200" height="26" rx="4" fill="#FFFFFF" stroke="#E28B96" stroke-width="1" />
    <text x="140" y="162" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="14" fill="#5A2E35" text-anchor="middle">
      Blessed Boutique
    </text>

    <!-- Store facade & window -->
    <rect x="25" y="160" width="230" height="190" fill="#FFF9F7" stroke="#E5C2BA" stroke-width="2" />
    <!-- Window pane -->
    <rect x="40" y="180" width="105" height="130" fill="#F4E8E3" stroke="#D9AAA0" stroke-width="2" rx="4" />
    <!-- Door -->
    <rect x="160" y="180" width="80" height="170" fill="#EAD5CC" stroke="#C8978D" stroke-width="2" />
    <!-- OPEN sign on door -->
    <rect x="175" y="215" width="50" height="22" rx="3" fill="#D9534F" />
    <text x="200" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#FFF" text-anchor="middle">
      OPEN
    </text>

    <!-- Chic Fashionista illustration with shopping bags -->
    <g transform="translate(190, 160) scale(0.95)">
      <!-- Hair & Face -->
      <circle cx="50" cy="40" r="14" fill="#EFC3B0" />
      <path d="M 38 32 C 40 20 62 18 64 30 C 65 42 60 48 50 48 C 42 48 38 42 38 32 Z" fill="#2C2623" />
      <!-- Chic Coat -->
      <path d="M 36 54 L 64 54 L 72 170 L 28 170 Z" fill="#F2E6DF" stroke="#D3B8AB" stroke-width="1.5" />
      <!-- Black Trousers & Heels -->
      <path d="M 42 170 L 40 220 L 48 220 L 50 170 Z M 52 170 L 54 220 L 62 220 L 60 170 Z" fill="#1A1817" />
      <!-- Luxury shopping bag in hand -->
      <rect x="10" y="115" width="28" height="34" rx="2" fill="#1C1A19" />
      <path d="M 18 115 C 18 104 30 104 30 115" stroke="#D4AF37" stroke-width="1.5" fill="none" />
      <rect x="68" y="110" width="30" height="38" rx="2" fill="#D1929C" />
      <path d="M 77 110 C 77 98 89 98 89 110" stroke="#FFF" stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- Golden Sun illustration in top center -->
  <g transform="translate(480, 50)">
    <circle cx="40" cy="40" r="16" fill="#F8C03F" />
    <!-- Rays -->
    <path d="M 40 10 L 40 20 M 40 70 L 40 60 M 10 40 L 20 40 M 70 40 L 60 40 M 18 18 L 26 26 M 62 62 L 54 54 M 18 62 L 26 54 M 62 18 L 54 26" stroke="#F8C03F" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Right: Official Typography and Contact Badges -->
  <g transform="translate(560, 90)">
    <!-- Main Ribbon / Brand Plate "Blessed Boutique" -->
    <rect x="-10" y="10" width="560" height="85" rx="8" fill="#FFFFFF" filter="drop-shadow(0 6px 14px rgba(90,46,53,0.08))" />
    <text x="270" y="68" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-weight="700" font-size="52" fill="#3D1D23" text-anchor="middle" letter-spacing="2">
      Blessed Boutique
    </text>

    <!-- Tagline: "Elegant • Trendy • Affordable" -->
    <text x="270" y="130" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="600" font-size="24" fill="#6A3B44" text-anchor="middle" letter-spacing="1">
      Elegant  •  Trendy  •  Affordable
    </text>

    <!-- Location Pin Row -->
    <g transform="translate(10, 170)">
      <!-- Red location pin icon -->
      <path d="M 18 5 C 10 5 4 11 4 19 C 4 29 18 42 18 42 C 18 42 32 29 32 19 C 32 11 26 5 18 5 Z" fill="#D32F2F" />
      <circle cx="18" cy="18" r="5" fill="#FFF" />
      <text x="50" y="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="20" fill="#2E2325" letter-spacing="1">
        Islampur, Dhaka, Bangladesh
      </text>
    </g>

    <!-- WhatsApp / Phone Row -->
    <g transform="translate(10, 230)">
      <!-- WhatsApp icon -->
      <circle cx="18" cy="18" r="16" fill="#25D366" />
      <path d="M 12 11 C 12 11 13 15 15 17 C 17 19 21 20 21 20 L 23 18 C 23 18 24 18 25 19 L 26 21 C 26 22 25 24 23 24 C 18 24 10 16 10 11 C 10 9 12 8 13 8 L 15 9 C 16 10 16 11 15 12 L 12 11 Z" fill="#FFF" />
      <text x="50" y="26" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="21" fill="#1D2A1F" letter-spacing="1">
        01333-100412  /  01991-103203
      </text>
    </g>

    <!-- Email Bottom Right -->
    <text x="540" y="315" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="15" fill="#5A3A40" text-anchor="end">
      boutiqueblessedreal@gmail.com
    </text>
  </g>
</svg>
