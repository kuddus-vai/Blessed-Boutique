<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Soft blush pink background matching Blessed Boutique brand -->
  <rect width="400" height="400" rx="32" fill="#FCECE7" />
  
  <!-- Subtle decorative inner border -->
  <rect x="16" y="16" width="368" height="368" rx="24" fill="none" stroke="#E8C9C1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Floral botanical branch illustration on top left -->
  <g transform="translate(90, 80) scale(0.9)" stroke="#6C3B43" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stem -->
    <path d="M 20 100 C 20 60 40 35 60 10" />
    <!-- Leaf left -->
    <path d="M 30 75 C 5 70 0 55 15 50 C 30 45 35 65 30 75 Z" fill="#FCECE7" stroke="#6C3B43" stroke-width="2"/>
    <!-- Leaf right -->
    <path d="M 45 50 C 65 40 75 50 65 65 C 55 75 42 60 45 50 Z" fill="#FCECE7" stroke="#6C3B43" stroke-width="2"/>
    <!-- Flower Petals -->
    <path d="M 60 10 C 50 0 40 5 45 18 C 50 30 60 20 60 10 Z" fill="#FCECE7" stroke="#6C3B43" stroke-width="2"/>
    <path d="M 60 10 C 70 -5 85 0 78 15 C 72 26 62 18 60 10 Z" fill="#FCECE7" stroke="#6C3B43" stroke-width="2"/>
    <path d="M 60 10 C 50 -12 70 -18 75 -5 Z" fill="#FCECE7" stroke="#6C3B43" stroke-width="2"/>
  </g>

  <!-- Brand Typography -->
  <!-- "Blessed" script-style wordmark -->
  <text x="200" y="225" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-style="italic" font-weight="600" font-size="64" fill="#582C35" text-anchor="middle" letter-spacing="1">
    Blessed
  </text>

  <!-- "BOUTIQUE" refined serif caps -->
  <text x="200" y="275" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="28" fill="#582C35" text-anchor="middle" letter-spacing="8">
    BOUTIQUE
  </text>

  <!-- Tagline "ELEGANT STYLES FOR EVERY WOMAN" -->
  <text x="200" y="325" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="12" fill="#7D4E56" text-anchor="middle" letter-spacing="3">
    ELEGANT STYLES FOR EVERY WOMAN
  </text>
</svg>
